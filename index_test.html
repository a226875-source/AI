
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>秋香的圖片清單</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #fff8ed;
  padding: 20px;
}
h1 { color: #914d86; }
.item {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 12px;
  background: white;
  border-radius: 10px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.item img {
  width: 90px;
  height: 75px;
  object-fit: contain;
}
.name {
  flex: 1;
  min-width: 150px;
  overflow-wrap: anywhere;
}
.actions {
  display: flex;
  gap: 8px;
}
button {
  border: none;
  border-radius: 6px;
  padding: 10px 14px;
  color: white;
  cursor: pointer;
  font-size: 16px;
}
.open { background: #12638a; }
.copy { background: #683679; }
</style>
</head>
<body>
<h1>🌷 秋香的圖片清單</h1>
<div id="photos">正在讀取圖片……</div>

<script>
const owner = "a226875-source";
const repo = "AI";
const folder = "01.AI生成圖片";
const photos = document.getElementById("photos");

async function loadPhotos() {
  try {
    const url = "https://api.github.com/repos/"
      + owner + "/" + repo + "/contents/"
      + encodeURIComponent(folder);

    const response = await fetch(url);
    if (!response.ok) {
      throw new Error("讀取失敗");
    }

    const files = await response.json();
    const images = files.filter(file =>
      /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name)
    );

    photos.innerHTML = "";

    if (images.length === 0) {
      photos.textContent = "目前沒有圖片";
      return;
    }

    images.forEach(file => {
      const item = document.createElement("div");
      item.className = "item";

      const img = document.createElement("img");
      img.src = file.download_url;
      img.alt = file.name;
      img.loading = "lazy";

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = file.name;

      const actions = document.createElement("div");
      actions.className = "actions";

      const open = document.createElement("button");
      open.className = "open";
      open.textContent = "開啟";
      open.onclick = () => {
        window.open(file.download_url, "_blank");
      };

      const copy = document.createElement("button");
      copy.className = "copy";
      copy.textContent = "複製連結";
      copy.onclick = async () => {
        try {
          await navigator.clipboard.writeText(
            file.download_url
          );
          copy.textContent = "已複製！";
          setTimeout(() => {
            copy.textContent = "複製連結";
          }, 2000);
        } catch (error) {
          alert("複製失敗，請再試一次");
        }
      };

      actions.append(open, copy);
      item.append(img, name, actions);
      photos.appendChild(item);
    });
  } catch (error) {
    photos.textContent =
      "圖片讀取失敗，請確認網路連線。";
  }
}

loadPhotos();
</script>
</body>
</html>
